name: Cloud foundation checks

on:
  pull_request:
    paths:
      - "cloud/**"
      - "docs/cloud/**"
      - ".github/workflows/cloud-foundation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: cloud/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - run: npm test
      - run: npm run test:rules
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
