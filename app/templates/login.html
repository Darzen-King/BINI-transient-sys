<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BINI Blooms · {{ trans.get("auth.login","Login") }}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/app.css">
  <style>
    body { background: linear-gradient(135deg, #fdf4f9 0%, #fce7f3 100%); min-height: 100vh; }
    .login-card {
      max-width: 400px; margin: 0 auto;
      border-radius: 1.2rem;
      box-shadow: 0 8px 32px rgba(219,39,119,.15);
    }
  </style>
</head>
<body class="d-flex align-items-center py-5">
<div class="container">
  <div class="login-card card border-0 p-5">

    <!-- Language switcher (staff default is EN; Chinese is opt-in) -->
    <div class="d-flex justify-content-end gap-1 mb-2" style="margin-top:-1.5rem;margin-right:-1.5rem">
      <form method="post" action="/set-lang">
        <input type="hidden" name="lang" value="en">
        <button type="submit" class="btn btn-sm {% if lang=='en' %}btn-bb{% else %}btn-outline-secondary{% endif %}"
                style="font-size:.72rem;padding:.15rem .55rem">EN</button>
      </form>
      <form method="post" action="/set-lang">
        <input type="hidden" name="lang" value="zh">
        <button type="submit" class="btn btn-sm {% if lang=='zh' %}btn-bb{% else %}btn-outline-secondary{% endif %}"
                style="font-size:.72rem;padding:.15rem .55rem">中文</button>
      </form>
    </div>

    <!-- Brand -->
    <div class="text-center mb-4">
      <img src="/static/bini_blooms_logo.jpg" alt="BINI Blooms"
           style="height:64px;width:auto;object-fit:contain;margin-bottom:4px">
      <h2 class="fw-bold mb-1" style="color:#db2777">BINI Blooms</h2>
      <p class="text-muted" style="font-size:.85rem">{{ trans.get("auth.subtitle","Property Management System") }}</p>
    </div>

    {% if error %}
    <div class="alert alert-danger py-2 mb-3" style="font-size:.85rem">
      ⚠ {{ error }}
    </div>
    {% endif %}

    <form method="post" action="/login">
      <input type="hidden" name="next_url" value="{{ request.query_params.get('next', '/') }}">

      <div class="mb-3">
        <label class="form-label fw-semibold" style="font-size:.88rem">
          {{ trans.get("auth.username","Username") }}
        </label>
        <input type="text" name="username" class="form-control" required
               autocomplete="username" autofocus>
      </div>

      <div class="mb-4">
        <label class="form-label fw-semibold" style="font-size:.88rem">
          {{ trans.get("auth.password","Password") }}
        </label>
        <input type="password" name="password" class="form-control" required
               autocomplete="current-password">
      </div>

      <button type="submit" class="btn btn-bb w-100 py-2">
        {{ trans.get("auth.login_btn","Sign In") }}
      </button>
    </form>

    <div class="text-center mt-4" style="font-size:.75rem;color:#9ca3af">
      BINI Blooms MVP · FastAPI + SQLite ·
      <span class="badge bg-light text-muted border">{{ app_version }}</span>
    </div>
  </div>
</div>
</body>
</html>
